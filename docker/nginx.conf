server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # widget.js is a script-tag embed target loaded from other origins
    # (isaaclinder.com, a Shopify theme, ...). It isn't content-hashed, so
    # it needs an exact-match, short-cache override here -- otherwise the
    # generic long-cache rule below would make embedders serve a stale
    # bundle for up to 30 days after every deploy. Exact `location =`
    # matches always win over the regex block regardless of file order.
    location = /widget.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
